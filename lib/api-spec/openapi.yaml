openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: movement
    description: Paired movement activity
  - name: journal
    description: Conflict-safe paired journal synchronization
paths:
  /movement/accounts:
    post:
      operationId: createMovementAccount
      tags: [movement]
      responses:
        "201":
          description: Pairing key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MovementAccount" }
  /movement:
    get:
      operationId: getMovement
      tags: [movement]
      responses:
        "200":
          description: Paired movement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MovementData" }
  /movement/native:
    put:
      operationId: putMovementNative
      tags: [movement]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MovementNativeInput" }
      responses:
        "200":
          description: Updated movement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MovementData" }
  /movement/manual:
    post:
      operationId: addMovementManual
      tags: [movement]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MovementManualInput" }
      responses:
        "200":
          description: Updated movement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MovementData" }
  /movement/manual/{date}:
    delete:
      operationId: resetMovementManual
      tags: [movement]
      parameters:
        - in: path
          name: date
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
      responses:
        "200":
          description: Updated movement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MovementData" }
  /movement/settings:
    put:
      operationId: putMovementSettings
      tags: [movement]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MovementSettingsInput" }
      responses:
        "200":
          description: Updated movement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MovementData" }
  /journal:
    get:
      operationId: getJournal
      tags: [journal]
      responses:
        "200":
          description: All journal records and tombstones for the paired account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalSnapshot" }
        "401":
          description: A valid Movement pairing key is required
  /journal/changes:
    post:
      operationId: applyJournalChanges
      tags: [journal]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JournalChanges" }
      responses:
        "200":
          description: Per-record accepted writes and conflicts; retry with the same mutation IDs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalChangesResult" }
        "400":
          description: Invalid record mutation
        "401":
          description: A valid Movement pairing key is required
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    MovementAccount:
      type: object
      required: [key]
      properties:
        key: { type: string }
    MovementDay:
      type: object
      required: [date, nativeHours, manualHours]
      properties:
        date: { type: string }
        nativeHours:
          type: ["array", "null"]
          items: { type: integer }
        manualHours:
          type: array
          items: { type: integer }
    MovementData:
      type: object
      required: [days, goal, strideCm, weightKg]
      properties:
        days:
          type: array
          items: { $ref: "#/components/schemas/MovementDay" }
        goal: { type: integer }
        strideCm: { type: number }
        weightKg: { type: number }
    MovementNativeInput:
      type: object
      required: [date, hours]
      properties:
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        hours:
          type: array
          minItems: 24
          maxItems: 24
          items: { type: integer, minimum: 0, maximum: 100000 }
    MovementManualInput:
      type: object
      required: [id, date, hour, amount]
      properties:
        id: { type: string, minLength: 16, maxLength: 100 }
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        hour: { type: integer, minimum: 0, maximum: 23 }
        amount: { type: integer, minimum: 1, maximum: 100000 }
    MovementSettingsInput:
      type: object
      required: [goal, strideCm, weightKg]
      properties:
        goal: { type: integer, minimum: 1000, maximum: 100000 }
        strideCm: { type: number, minimum: 30, maximum: 150 }
        weightKg: { type: number, minimum: 20, maximum: 500 }
    JournalEntity:
      type: string
      enum: [meal, strengthSet, completedWorkout, waterDay, waterGoal, weightDay, nutritionGoals, profile, mealTemplate, liveWorkoutHistory]
    JournalRecord:
      type: object
      required: [entity, id, revision, deleted, data, updatedAt]
      properties:
        entity: { $ref: "#/components/schemas/JournalEntity" }
        id: { type: string }
        revision: { type: integer, minimum: 1 }
        deleted: { type: boolean }
        data:
          type: ["object", "null"]
          additionalProperties: true
        updatedAt: { type: string, format: date-time }
    JournalSnapshot:
      type: object
      required: [records]
      properties:
        records:
          type: array
          items: { $ref: "#/components/schemas/JournalRecord" }
    JournalRecordMutation:
      type: object
      required: [baseRevision, mutationId, deleted, data]
      properties:
        baseRevision: { type: integer, minimum: 0 }
        mutationId: { type: string, minLength: 16, maxLength: 100 }
        deleted: { type: boolean }
        data:
          type: ["object", "null"]
          additionalProperties: true
    JournalChange:
      allOf:
        - $ref: "#/components/schemas/JournalRecordMutation"
        - type: object
          required: [entity, id]
          properties:
            entity: { $ref: "#/components/schemas/JournalEntity" }
            id: { type: string, minLength: 1, maxLength: 100 }
    JournalChanges:
      type: object
      required: [changes]
      properties:
        changes:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/JournalChange" }
    JournalChangeConflict:
      type: object
      required: [entity, id, current]
      properties:
        entity: { $ref: "#/components/schemas/JournalEntity" }
        id: { type: string }
        current:
          oneOf:
            - $ref: "#/components/schemas/JournalRecord"
            - type: "null"
    JournalChangesResult:
      type: object
      required: [records, conflicts]
      properties:
        records:
          type: array
          items: { $ref: "#/components/schemas/JournalRecord" }
        conflicts:
          type: array
          items: { $ref: "#/components/schemas/JournalChangeConflict" }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

